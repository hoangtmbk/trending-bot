schedule:
  cron: "0 2 * * *"

scoring:
  digest_size: 15
  deep_dive_count: 5
  min_momentum_score: 0.3
  freshness_half_life_hours: 48
  cross_platform_boost:
    2: 1.5
    3: 2.5
    4: 4.0

sources:
  github:
    enabled: true
    min_stars_new_repo: 20
    min_stars_established: 500
    topics:
      - ai
      - llm
      - machine-learning
      - deep-learning
      - transformer
      - agents
      - computer-vision
      - nlp
      - rag
  reddit:
    enabled: true
    subreddits:
      - MachineLearning
      - LocalLLaMA
      - artificial
      - ChatGPT
      - singularity
      - StableDiffusion
  arxiv:
    enabled: true
    categories:
      - cs.AI
      - cs.CL
      - cs.CV
      - cs.LG
      - cs.MA
      - stat.ML
  huggingface:
    enabled: true
  hackernews:
    enabled: true
  blogs:
    enabled: true
    # Broken feeds are logged & skipped. Add freely — the scout tolerates 404s.
    feeds:
      - name: anthropic
        url: https://www.anthropic.com/news/rss.xml
      - name: openai
        url: https://openai.com/blog/rss.xml
      - name: deepmind
        url: https://deepmind.google/blog/rss.xml
      - name: huggingface
        url: https://huggingface.co/blog/feed.xml
      - name: mistral
        url: https://mistral.ai/news/rss.xml
      - name: meta_ai
        url: https://ai.meta.com/blog/rss/
      - name: cohere
        url: https://cohere.com/blog/rss.xml
      - name: qwen
        url: https://qwen.ai/blog/feed.xml

delivery:
  telegram:
    enabled: true
  dashboard:
    enabled: true
    port: 8080
    serve_dir: dashboard_out

orchestrator:
  db_path: trendbot.db
  task_poll_interval: 2
  agents:
    github_scout:
      schedule: "0 */4 * * *"
    reddit_scout:
      schedule: "0 */4 * * *"
    arxiv_scout:
      schedule: "0 */12 * * *"
    huggingface_scout:
      schedule: "0 */6 * * *"
    hackernews_scout:
      schedule: "0 */4 * * *"
    blog_scout:
      schedule: "0 */6 * * *"
    scorer:
      schedule: "on_demand"
    filter:
      schedule: "on_demand"
    dot_connector:
      schedule: "0 3 * * *"
    deep_diver:
      schedule: "on_demand"
    topic_tracker:
      schedule: "0 4 * * 1"
    digest_pusher:
      schedule: "0 8,20 * * *"
