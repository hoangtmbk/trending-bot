schedule:
  cron: "0 2 * * *"

scoring:
  digest_size: 15
  deep_dive_count: 5
  min_momentum_score: 0.3
  freshness_half_life_hours: 48
  cross_platform_boost:
    2: 1.5
    3: 2.5
    4: 4.0
  # Per-org multipliers on the final score. Longer matches win — so
  # github.com/openai beats github.com for an openai repo URL.
  org_priors:
    anthropic.com: 2.0
    openai.com: 2.0
    deepmind.google: 2.0
    ai.meta.com: 1.8
    huggingface.co/meta-llama: 1.8
    huggingface.co/Qwen: 1.8
    huggingface.co/mistralai: 1.8
    huggingface.co/google: 1.6
    mistral.ai: 1.8
    cohere.com: 1.6
    qwen.ai: 1.8
    github.com/anthropics: 1.8
    github.com/openai: 1.8
    github.com/google-deepmind: 1.8
    github.com/huggingface: 1.6
    github.com/vllm-project: 1.5
    github.com/ggerganov: 1.5

sources:
  github:
    enabled: true
    min_stars_new_repo: 20
    min_stars_established: 500
    topics:
      - ai
      - llm
      - machine-learning
      - deep-learning
      - transformer
      - agents
      - computer-vision
      - nlp
      - rag
  reddit:
    enabled: true
    subreddits:
      - MachineLearning
      - LocalLLaMA
      - artificial
      - ChatGPT
      - singularity
      - StableDiffusion
  arxiv:
    enabled: true
    categories:
      - cs.AI
      - cs.CL
      - cs.CV
      - cs.LG
      - cs.MA
      - stat.ML
  huggingface:
    enabled: true
  hackernews:
    enabled: true
  blogs:
    enabled: true
    # Broken feeds are logged & skipped. Add freely — the scout tolerates 404s.
    feeds:
      - name: anthropic
        url: https://www.anthropic.com/news/rss.xml
      - name: openai
        url: https://openai.com/blog/rss.xml
      - name: deepmind
        url: https://deepmind.google/blog/rss.xml
      - name: huggingface
        url: https://huggingface.co/blog/feed.xml
      - name: mistral
        url: https://mistral.ai/news/rss.xml
      - name: meta_ai
        url: https://ai.meta.com/blog/rss/
      - name: cohere
        url: https://cohere.com/blog/rss.xml
      - name: qwen
        url: https://qwen.ai/blog/feed.xml
  newsletters:
    enabled: true
    feeds:
      - name: import_ai
        url: https://jack-clark.net/feed/
      - name: interconnects
        url: https://www.interconnects.ai/feed
      - name: tldr_ai
        url: https://tldr.tech/api/rss/ai
      - name: the_rundown_ai
        url: https://www.therundown.ai/feed
  hf_papers:
    enabled: true
  lobsters:
    enabled: true
    url: https://lobste.rs/t/ai.rss
  papers_with_code:
    enabled: true
  github_releases:
    enabled: true
    # Watched repos whose releases we care about. Keep this list tight —
    # these become one item per release per repo.
    repos:
      - vllm-project/vllm
      - ggerganov/llama.cpp
      - huggingface/transformers
      - anthropics/claude-code
      - langchain-ai/langchain
      - microsoft/autogen
      - ollama/ollama
      - pytorch/pytorch
      - karpathy/nanogpt
      - unslothai/unsloth

delivery:
  telegram:
    enabled: true
  dashboard:
    enabled: true
    port: 8080
    serve_dir: dashboard_out

orchestrator:
  db_path: trendbot.db
  task_poll_interval: 2
  agents:
    github_scout:
      schedule: "0 */4 * * *"
    reddit_scout:
      schedule: "0 */4 * * *"
    arxiv_scout:
      schedule: "0 */12 * * *"
    huggingface_scout:
      schedule: "0 */6 * * *"
    hackernews_scout:
      schedule: "0 */4 * * *"
    blog_scout:
      schedule: "0 */6 * * *"
    newsletter_scout:
      schedule: "0 */12 * * *"
    hf_papers_scout:
      schedule: "0 */6 * * *"
    lobsters_scout:
      schedule: "0 */6 * * *"
    papers_with_code_scout:
      schedule: "0 */12 * * *"
    github_releases_scout:
      schedule: "0 */6 * * *"
    scorer:
      schedule: "on_demand"
    filter:
      schedule: "on_demand"
    dot_connector:
      schedule: "0 3 * * *"
    topic_velocity:
      schedule: "0 */4 * * *"
    deep_diver:
      schedule: "on_demand"
    topic_tracker:
      schedule: "0 4 * * 1"
    digest_pusher:
      schedule: "0 8,20 * * *"
